[package]
name = "ratail"
version = "0.1.0"
edition = "2024"
description = "Lightweight async framework for ratatui"

[dependencies]
arc-swap = "1.7.1"
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures-core = "0.3.34"
ratatui = "0.30.2"
tokio = { version = "1.48.0", features = ["macros", "rt", "sync", "time"] }
