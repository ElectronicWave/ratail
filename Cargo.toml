[package]
name = "ratail"
version = "0.1.0"
edition = "2024"
description = "Lightweight async framework for ratatui"

[dependencies]
arc-swap = { version = "1.7.1", default-features = false }
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures-core = { version = "0.3.34", default-features = false }
lru = { version = "0.19.0", default-features = false }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
tokio = { version = "1.48.0", default-features = false, features = ["macros", "rt", "sync"] }

[dev-dependencies]
tokio = { version = "1.48.0", default-features = false, features = ["time"] }
